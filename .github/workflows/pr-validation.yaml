name: pr-validation

on:
  pull_request:
    branches:
      - develop

jobs:
  linting:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          npm install -g htmlhint stylelint

      # Step 4: Lint HTML files
      - name: Lint HTML files
        run: htmlhint "src/**/*.html"

      # Step 5: Lint CSS files
      - name: Lint CSS files
        run: stylelint "styles/**/*.css"

  build:
    name: Build Static Website
    runs-on: ubuntu-latest
    needs: linting

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Step 3: Install Parcel and dependencies
      - name: Install Parcel
        run: |
          npm install -g parcel
          npm install

      # Step 4: Build the website
      - name: Build the website
        run: parcel build src/index.html
