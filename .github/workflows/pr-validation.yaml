name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  linting:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the PR
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Install necessary dependencies for linting
      - name: Install dependencies for linting
        run: |
          npm install -g htmlhint stylelint

      # Lint HTML files in the 'src' folder
      - name: Lint HTML files
        run: htmlhint "src/**/*.html"

      # Lint CSS files in the 'styles' folder
      - name: Lint CSS files
        run: stylelint "styles/**/*.css"

  build:
    name: Build Static Website
    runs-on: ubuntu-latest
    needs: linting  # Ensure this job runs only after linting passes

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Install Parcel and other dependencies
      - name: Install Parcel and dependencies
        run: |
          npm install -g parcel
          npm install

      # Build the static website with Parcel (without deploying it)
      - name: Build the website using Parcel
        run: |
          parcel build src/index.html --no-source-maps --no-cache

      # Ensure Parcel built successfully (this step will only pass if the build was successful)
      - name: Verify build success
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found!";
            exit 1;
          fi
          echo "Build was successful!";